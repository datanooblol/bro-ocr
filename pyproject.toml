[project]
name = "bro-ocr"
version = "0.1.0"
description = "Lightweight, LLM-agnostic OCR scaffolding: define regions and schemas with Template, build/validate structured extraction with SchemaConverter."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
]

[project.urls]
Homepage = "https://github.com/datanooblol/bro-ocr"
Repository = "https://github.com/datanooblol/bro-ocr"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bro_ocr"]

[dependency-groups]
dev = [
    "opencv-python>=5.0.0.93",
    "boto3>=1.43.78",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
